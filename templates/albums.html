<!doctype html>
<html>
    <head>
        <title>Les albums, leur année de sortie et le groupe </title>
    </head>    
    <body>
        <h1>Listes des albums avec leur année de sortie et le groupe :</h1>

        <ul>
            {%for alb in albums%}
            <li>{{alb[0]}} sorti en {{alb[1]}} par {{alb[2]}}.</li>
            {%endfor%}
        </ul>

        <form action="" method="post" class="formComment">
            <div class="formComment">
                <label for="name">Entrez votre pseudo&nbsp;:</label>
                <input type="text" name="name" id="name" required/>
            </div>
            <div class="formComment">
                <label for="commentaire">Saisissez votre commentaire&nbsp;:</label>
                <input type="text" name="commentaire" id="commentaire" required />
            </div>
            <div class="formComment">
                <input type="submit" value="Envoyer" />
            </div>
        </form>

        <a href="/">Retour au menu</a>
    </body>
</html>
