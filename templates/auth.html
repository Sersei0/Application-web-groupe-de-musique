<!doctype html>
<html>
    <head>
        <title>Se connecter</title>
    </head>    
    <body>
        <h1>Connexion</h1>

        <form method="post" action="{{ url_for('menu') }}" class="formAuth">
            
            <div class="formAuth">
                <label for="login">Entrez votre login&nbsp;:</label>
                <input type="text" name="login" id="login"/>
            </div>
            <div class="formAuth">
                <label for="password">Entrez votre mot de passe&nbsp;:</label>
                <input type="text" name="password" id="password"/>
            </div>

            <input type="submit" value="Se connecter"/>
        </form>
    </body>
</html>
